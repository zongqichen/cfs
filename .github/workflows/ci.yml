name: CI

env:
  GO_VERSION: "1.27.1"
  CF_CLI_VERSION: "8.19.0"
  CF_CLI_LINUX_X86_64_SHA256: "98268ab3134bb3a1c97ffce797b4e6d35590a82e006cd098ad7a29f0a5cae7d8"
  CF_CLI_MACOS_X86_64_SHA256: "7a1ea3ff7b34a42ed1db72475693ca01675cd9297c4d9f5981eb77af2f673471"
  CF_CLI_MACOS_ARM64_SHA256: "491f9b5fdf4da522c33c135e48baf20d3aba0a2f34d0b63d2b8acb79c8410578"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 4 * * 1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/cfs

  minimum-go:
    name: test (minimum Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  release-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check release builds
        run: make release-check

  e2e:
    name: E2E (official CF CLI, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install checksum-pinned CF CLI
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)
              asset=linux_x86-64
              expected_sha256=$CF_CLI_LINUX_X86_64_SHA256
              ;;
            Darwin/x86_64)
              asset=osx
              expected_sha256=$CF_CLI_MACOS_X86_64_SHA256
              ;;
            Darwin/arm64)
              asset=macosarm
              expected_sha256=$CF_CLI_MACOS_ARM64_SHA256
              ;;
            *)
              echo "Unsupported E2E runner: $(uname -s)/$(uname -m)" >&2
              exit 1
              ;;
          esac
          install_root="$RUNNER_TEMP/cf-cli"
          archive="$RUNNER_TEMP/cf-cli.tgz"
          mkdir -p "$install_root"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/cloudfoundry/cli/releases/download/v${CF_CLI_VERSION}/cf8-cli_${CF_CLI_VERSION}_${asset}.tgz" \
            --output "$archive"
          actual_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "CF CLI checksum mismatch: $actual_sha256" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$install_root" cf cf8
          "$install_root/cf" version
      - name: Run end-to-end suite
        env:
          CFS_REAL_CF: ${{ runner.temp }}/cf-cli/cf
        run: make e2e

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check vulnerabilities and secrets
        run: make security

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
